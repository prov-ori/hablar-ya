{id:'people',name:'Я, ты и весь мир',level:'A1',icon:'🌍',desc:'Расскажи, кто ты и откуда.',rule:'Глагол <b>ser</b> помогает назвать происхождение, профессию и личность: yo <b>soy</b>, tú <b>eres</b>, él/ella <b>es</b>, nosotros <b>somos</b>, vosotros <b>sois</b>, ellos <b>son</b>.',examples:['Soy de Estonia. — Я из Эстонии.','Ella es profesora. — Она преподаватель.','Somos amigos. — Мы друзья.'],tip:'Местоимение часто опускают: soy estudiante уже означает «я студент / студентка».',words:[['amigo','друг'],['amiga','подруга'],['estudiante','студент / студентка'],['profesor','преподаватель'],['país','страна'],['ciudad','город']],q:[['Yo ___ de Estonia.',['es','soy','eres'],1,'Yo сочетается с soy: soy de Estonia.'],['«Мы друзья» — это…',['Somos amigos','Son amigos','Soy amigo'],0,'Nosotros somos — мы являемся. Местоимение можно опустить.'],['Ella es ___.',['profesora','profesoras','profesores'],0,'Ella — она, поэтому здесь нужна форма единственного числа profesora.']],sentence:'Soy de Estonia',translation:'Я из Эстонии.'},
{id:'cafe',name:'Один кофе, пожалуйста',level:'A1',icon:'☕',desc:'Сделай заказ и попроси счёт.',rule:'<b>Quiero</b> — «я хочу», <b>quisiera</b> — более мягкое «я хотел(а) бы». Для простого заказа подойдёт <b>Un café, por favor</b>.',examples:['Quisiera un café con leche. — Я хотел(а) бы кофе с молоком.','La cuenta, por favor. — Счёт, пожалуйста.','¿Cuánto cuesta? — Сколько стоит?'],tip:'Un/una — неопределённые артикли. Un café, una tostada. Род лучше запоминать вместе со словом.',words:[['el café','кофе'],['la leche','молоко'],['el agua','вода'],['el pan','хлеб'],['la cuenta','счёт'],['el té','чай']],q:[['Как попросить счёт?',['La leche, por favor','La cuenta, por favor','El pan, por favor'],1,'La cuenta — счёт в кафе или ресторане.'],['Кофе с молоком — это…',['café sin leche','café con leche','té con leche'],1,'Con значит «с», sin — «без».'],['Как вежливо заказать чай?',['Quisiera un té','Soy un té','Tengo un té'],0,'Quisiera — вежливая просьба. Tengo un té означает «у меня есть чай».']],sentence:'Un café con leche por favor',translation:'Кофе с молоком, пожалуйста.'},
{id:'family',name:'Люди рядом',level:'A1',icon:'🏡',desc:'Семья, возраст и близкие люди.',rule:'Возраст выражают с <b>tener</b>: <b>tengo veinte años</b> — мне двадцать лет. Формы: tengo, tienes, tiene, tenemos, tenéis, tienen.',examples:['Tengo una hermana. — У меня есть сестра.','Mi padre tiene cincuenta años. — Моему отцу пятьдесят лет.','Esta es mi familia. — Это моя семья.'],tip:'Mi — «мой / моя» перед одним предметом: mi madre, mi padre. Перед несколькими — mis: mis hermanos.',words:[['la madre','мать'],['el padre','отец'],['la hermana','сестра'],['el hermano','брат'],['la familia','семья'],['los años','годы']],q:[['Мне 20 лет.',['Soy veinte años','Tengo veinte años','Estoy veinte años'],1,'Для возраста нужен tener: буквально «имею двадцать лет».'],['___ madre se llama María.',['Mis','Mi','Yo'],1,'Madre — единственное число, поэтому mi.'],['Nosotros ___ dos hermanos.',['tiene','tengo','tenemos'],2,'Форма tener для nosotros — tenemos.']],sentence:'Tengo una hermana',translation:'У меня есть сестра.'},
{id:'city',name:'Потеряться и найтись',level:'A1',icon:'🧭',desc:'Спроси дорогу и найди нужное место.',rule:'<b>Hay</b> сообщает о наличии: hay un banco — есть банк. <b>Está</b> указывает, где находится известный объект: el banco está aquí.',examples:['¿Dónde está la estación? — Где вокзал?','Sigue todo recto. — Иди прямо.','Gira a la derecha. — Поверни направо.'],tip:'Hay не меняется по числам: hay una tienda, hay dos tiendas.',words:[['la calle','улица'],['la estación','вокзал / станция'],['la tienda','магазин'],['a la derecha','направо'],['a la izquierda','налево'],['todo recto','прямо']],q:[['Где вокзал?',['¿Dónde es la estación?','¿Dónde está la estación?','¿Qué es la estación?'],1,'Для местонахождения объекта употребляем estar.'],['___ dos tiendas aquí.',['Hay','Está','Es'],0,'Hay означает «есть / имеется» и не меняется по числам.'],['A la izquierda — это…',['направо','прямо','налево'],2,'Izquierda — левая сторона, derecha — правая.']],sentence:'La estación está a la derecha',translation:'Вокзал находится справа.'},
{id:'day',name:'Обычный необычный день',level:'A1',icon:'🌤️',desc:'Привычки, время и настоящее время.',rule:'У правильных глаголов на <b>-ar</b> окончания: -o, -as, -a, -amos, -áis, -an. Hablar → hablo, hablas, habla…',examples:['Hablo español. — Я говорю по-испански.','Trabajo por la mañana. — Я работаю утром.','Me levanto a las ocho. — Я встаю в восемь.'],tip:'Для времени: a las dos, a las ocho, но a la una — в час.',words:[['hablar','говорить'],['trabajar','работать'],['estudiar','учиться'],['la mañana','утро'],['la tarde','вторая половина дня / вечер'],['la noche','ночь / поздний вечер']],q:[['Yo ___ español.',['hablas','hablo','habla'],1,'В первом лице у hablar окончание -o: hablo.'],['Tú ___ mucho.',['trabajas','trabajo','trabajan'],0,'Tú требует окончания -as: trabajas.'],['«В восемь» — это…',['a la ocho','a las ocho','en ocho'],1,'Для часа используется a las, кроме a la una.']],sentence:'Estudio español por la mañana',translation:'Я учу испанский утром.'},
{id:'food',name:'Вкус Испании',level:'A1',icon:'🍋',desc:'Продукты, покупки и предпочтения.',rule:'<b>Me gusta</b> — мне нравится один предмет или действие. <b>Me gustan</b> — мне нравятся несколько предметов.',examples:['Me gusta la paella. — Мне нравится паэлья.','Me gustan las naranjas. — Мне нравятся апельсины.','No como carne. — Я не ем мясо.'],tip:'В me gustan las manzanas подлежащее — яблоки, поэтому глагол во множественном числе.',words:[['la naranja','апельсин'],['la manzana','яблоко'],['el queso','сыр'],['el pescado','рыба'],['la carne','мясо'],['las verduras','овощи']],q:[['Me ___ las naranjas.',['gusta','gustan','gusto'],1,'Las naranjas — множественное число, поэтому gustan.'],['Мне нравится готовить.',['Me gustan cocinar','Me gusta cocinar','Yo gusta cocinar'],1,'Перед инфинитивом cocinar используется gusta.'],['«Я не ем мясо» — это…',['No como carne','No bebo carne','No soy carne'],0,'Como — форма глагола comer (есть). Bebo — пью.']],sentence:'Me gustan las naranjas',translation:'Мне нравятся апельсины.'},
{id:'travel',name:'Билет в приключение',level:'A2',icon:'🚆',desc:'Транспорт, билеты и бронирование.',rule:'Для планов используем <b>ir + a + инфинитив</b>: voy a viajar — я собираюсь путешествовать. Ir: voy, vas, va, vamos, vais, van.',examples:['Voy a viajar a Madrid. — Я собираюсь поехать в Мадрид.','Quiero un billete de ida y vuelta. — Я хочу билет туда и обратно.','¿A qué hora sale el tren? — Во сколько отправляется поезд?'],tip:'Для направления в город нужен предлог a: voy a Madrid. De указывает исходную точку: vengo de Madrid.',words:[['el billete','билет'],['el tren','поезд'],['el avión','самолёт'],['el aeropuerto','аэропорт'],['el viaje','поездка'],['la maleta','чемодан']],q:[['Завтра я собираюсь путешествовать.',['Mañana voy viajar','Mañana voy a viajar','Mañana soy viajar'],1,'Между формой ir и инфинитивом обязательно стоит a.'],['Мы едем в Мадрид.',['Vamos a Madrid','Voy a Madrid','Van de Madrid'],0,'Vamos — мы едем, a Madrid — в Мадрид.'],['Ida y vuelta — это…',['только туда','туда и обратно','первый класс'],1,'Ida — путь туда, vuelta — возвращение.']],sentence:'Voy a viajar a Madrid',translation:'Я собираюсь поехать в Мадрид.'},
{id:'hotel',name:'Как дома',level:'A2',icon:'🛎️',desc:'Заселение, просьбы и удобства.',rule:'<b>Quisiera</b> и <b>¿Podría…?</b> помогают вежливо попросить. Necesito — «мне нужно». Для состояния комнаты используется estar.',examples:['Tengo una reserva. — У меня есть бронь.','¿Podría ayudarme? — Вы могли бы мне помочь?','La habitación está limpia. — Комната чистая.'],tip:'Una habitación doble — двухместный номер. Con desayuno — с завтраком, sin desayuno — без завтрака.',words:[['la habitación','комната / номер'],['la reserva','бронь'],['la llave','ключ'],['el desayuno','завтрак'],['la cama','кровать'],['el baño','ванная / туалет']],q:[['У меня есть бронь.',['Soy una reserva','Tengo una reserva','Voy una reserva'],1,'Tengo — «у меня есть».'],['Номер с завтраком.',['Habitación sin desayuno','Habitación con desayuno','Habitación de llave'],1,'Con desayuno — с завтраком.'],['Как вежливо попросить помощи?',['¿Podría ayudarme?','¿Dónde está?','¿Cuántos años tienes?'],0,'¿Podría ayudarme? — вежливая просьба о помощи.']],sentence:'Tengo una reserva para dos noches',translation:'У меня бронь на две ночи.'},
{id:'past',name:'Как прошли выходные?',level:'A2',icon:'📷',desc:'Завершённые события в прошлом.',rule:'Для завершённых событий в определённый прошлый период подходит <b>pretérito indefinido</b>. Hablar: hablé, hablaste, habló, hablamos, hablasteis, hablaron.',examples:['Ayer visité un museo. — Вчера я посетил(а) музей.','El sábado comí paella. — В субботу я ел(а) паэлью.','Fuimos a la playa. — Мы сходили на пляж.'],tip:'Ударение важно: hablo — «я говорю», habló — «он / она говорил(а)».',words:[['ayer','вчера'],['el museo','музей'],['la playa','пляж'],['el sábado','суббота'],['la foto','фотография'],['el fin de semana','выходные']],q:[['Вчера я посетил(а) музей.',['Ayer visito un museo','Ayer visité un museo','Ayer visitar un museo'],1,'Visité — форма прошедшего времени для yo.'],['Habló — это…',['я говорю','он / она говорил(а)','ты говоришь'],1,'Ударение на ó отличает habló от hablo.'],['Мы сходили на пляж.',['Fui a la playa','Fueron a la playa','Fuimos a la playa'],2,'Fuimos — прошедшая форма ir для nosotros.']],sentence:'Ayer visité un museo',translation:'Вчера я посетил(а) музей.'},
{id:'plans',name:'Увидимся завтра',level:'A2',icon:'🗓️',desc:'Предложи встречу и договорись о времени.',rule:'<b>¿Quedamos…?</b> — «Встретимся…?»; <b>¿Te apetece…?</b> — «Тебе хочется…?»; <b>puedo / no puedo</b> — «могу / не могу».',examples:['¿Quedamos a las seis? — Встретимся в шесть?','¿Te apetece ir al cine? — Хочешь пойти в кино?','Lo siento, no puedo. — Извини, я не могу.'],tip:'A + el сокращается в al: ir al cine. Но a la не сокращается: ir a la playa.',words:[['mañana','завтра'],['el cine','кинотеатр'],['la semana','неделя'],['hoy','сегодня'],['quedar','договариваться о встрече'],['poder','мочь']],q:[['Пойти в кино.',['Ir a el cine','Ir al cine','Ir en cine'],1,'A + el обязательно образует al.'],['Как предложить встречу в шесть?',['¿Quedamos a las seis?','¿Tenemos seis años?','¿Somos seis?'],0,'Quedar используется для договорённости о встрече.'],['Я не могу.',['No puedo','No puede','No poder'],0,'Puedo — форма poder для yo.']],sentence:'¿Quedamos mañana a las seis?',translation:'Встретимся завтра в шесть?'},
{id:'feelings',name:'Как ты себя чувствуешь?',level:'A2',icon:'🌿',desc:'Состояния, самочувствие и простые просьбы.',rule:'<b>Estar</b> описывает состояние: estoy cansado/cansada. <b>Tener</b> входит в выражения tener frío, tener calor, tener hambre.',examples:['Estoy cansada. — Я устала.','Tengo frío. — Мне холодно.','Me duele la cabeza. — У меня болит голова.'],tip:'Ser/estar нельзя свести только к «постоянное/временное»: например, местонахождение человека выражают через estar.',words:[['cansado','уставший'],['contento','довольный'],['el frío','холод'],['el calor','жара'],['el hambre','голод'],['la cabeza','голова']],q:[['Мне холодно.',['Soy frío','Tengo frío','Estoy frío'],1,'Ощущение холода выражают устойчивым сочетанием tener frío.'],['Я устала.',['Soy cansada','Estoy cansada','Tengo cansada'],1,'Для состояния используется estar: estoy cansada.'],['У меня болит голова.',['Me duele la cabeza','Me gusta la cabeza','Tengo la cabeza'],0,'Me duele… — у меня болит…']],sentence:'Estoy contento hoy',translation:'Сегодня я доволен.'}
];
const words=topics.flatMap(t=>t.words.map((w,i)=>({id:t.id+i,es:w[0],ru:w[1],topic:t.id})));const fresh=()=>({xp:0,completed:[],favorites:[],reviews:{},activity:{},goal:30});let state;try{state=JSON.parse(localStorage.getItem('hablar-ya-v1'))||fresh();if(!Array.isArray(state.completed)||!state.activity||!state.reviews||!Array.isArray(state.favorites))state=fresh()}catch{state=fresh()};state={...fresh(),...state};
const today=()=>new Date().toLocaleDateString('en-CA');const save=()=>{try{localStorage.setItem('hablar-ya-v1',JSON.stringify(state))}catch{toast('Браузер не разрешает сохранять прогресс. Он доступен до закрытия страницы.')}header()};function reward(n){state.xp+=n;state.activity[today()]=(state.activity[today()]||0)+n;save()};function streak(){let n=0,d=new Date();if(!state.activity[today()])d.setDate(d.getDate()-1);while(state.activity[d.toLocaleDateString('en-CA')]){n++;d.setDate(d.getDate()-1)}return n}function header(){document.querySelector('#xp').textContent=state.xp;document.querySelector('#streak').textContent=streak()};let toastTimer;function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function speak(text,slow=false){if(!('speechSynthesis'in window)){toast('Озвучка недоступна в этом браузере. Испанский текст остаётся доступен.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=slow?.65:.85;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));if(v)u.voice=v;u.onerror=()=>toast('Не удалось воспроизвести звук. Проверь голосовые пакеты и настройки браузера.');speechSynthesis.speak(u)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const audioBtn=s=>`<button class="audio" aria-label="Прослушать: ${esc(s)}" data-speak="${esc(s)}">▷</button>`;const intro=(ey,title,sub)=>`<div class="page-intro"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="muted">${sub}</p></div><span class="pill">✦ Aprende a tu ritmo</span></div>`;const foot=()=>`<footer><span>hablar ya. · Маленькие шаги. Настоящие разговоры.</span><span>Сделано для любопытных к миру</span></footer>`;const app=document.querySelector('#app');let page='home',filter='all',wordQuery='',onlySaved=false,session=null,review=null,dialog=null,match=null;
function route(){page=location.hash.slice(1)||'home';if(!navItems.some(n=>n[0]===page))page='home';session=null;review=null;dialog=null;match=null;filter='all';document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===page);if(a.dataset.nav===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.querySelector('#crumb').textContent=navItems.find(n=>n[0]===page)[1];render();window.scrollTo(0,0)}
function render(){header();({home:home,course:course,words:vocabulary,grammar:grammar,dialogues:dialogues,games:games,progress:progressPage}[page])()}
function home(){let next=topics.find(t=>!state.completed.includes(t.id))||topics[0],daily=state.activity[today()]||0;app.innerHTML=intro('¡Qué bueno verte!','Испанский начинается с тебя.','Новый день — ещё один повод сказать ¡hola!')+`<div class="dashboard-grid"><div><section class="hero"><div class="hero-copy"><div class="eyebrow">Твой следующий маленький шаг</div><h2>${state.completed.length?'Продолжим твою<br>историю.':'Большой мир.<br>На новом языке.'}</h2><p>${state.completed.length?esc(next.name)+' — следующий урок твоего маршрута.':'От первого hola до разговоров за чашкой кофе. Начни с простого — начни сегодня.'}</p><button class="btn" data-lesson="${next.id}">${state.completed.length?'Продолжить обучение':'Начать первый урок'} <span>↗</span></button><div class="tiny muted" style="margin-top:12px">${next.level} · 5–8 минут · В твоём темпе</div></div><div class="hero-art" aria-hidden="true"><div class="sun"></div><div class="speech">¡Hola, mundo!</div><div class="arch"></div><div class="plant">🌿</div><div class="tile"></div><div class="stamp">PASAPORTE<br>AL MUNDO<br>✦</div></div></section><div class="section-title"><h2>Как будем практиковаться?</h2><a href="#games" class="text-link">Все форматы ↗</a></div><div class="cards"><button class="practice-card" data-action="listen"><div class="card-icon">◖))</div><h3>Поймай на слух</h3><p>Слушай испанскую речь<br>и узнавай знакомые слова.</p><span class="card-footer">Аудирование <span>↗</span></span></button><button class="practice-card" data-action="review"><div class="card-icon">▱</div><h3>Слова остаются</h3><p>Вспомни знакомое.<br>Дай новым словам прижиться.</p><span class="card-footer">Карточки <span>↗</span></span></button><a class="practice-card" href="#dialogues"><div class="card-icon">☏</div><h3>Давай поговорим</h3><p>Кафе, вокзал, новая встреча.<br>Репетируй реальную жизнь.</p><span class="card-footer">Ситуации <span>↗</span></span></a></div><div class="section-title"><h2>Твой маршрут</h2><a href="#course" class="text-link">Открыть курс ↗</a></div><div class="journey"><div class="card-icon">🧭</div><div><h3>От знакомства к приключениям</h3><p>12 тем · A1–A2 · ${state.completed.length} пройдено</p><div class="progress"><span style="width:${state.completed.length/12*100}%"></span></div></div><button class="btn secondary small" data-lesson="${next.id}">Поехали →</button></div></div><aside class="right-stack"><section class="panel"><div class="row spread"><h3>Маленькая цель дня</h3><span>☀</span></div><div class="goal"><div class="ring" style="--value:${Math.min(100,daily/state.goal*100)}"><div>${Math.min(100,Math.round(daily/state.goal*100))}%<small>на сегодня</small></div></div><div><strong>${daily} / ${state.goal} XP</strong><p class="tiny muted">Каждый ответ —<br>шаг вперёд.</p></div></div><div class="week">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return `<div>${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]}<div class="day ${state.activity[d.toLocaleDateString('en-CA')]?'done':''}">${state.activity[d.toLocaleDateString('en-CA')]?'✓':'·'}</div></div>`}).join('')}</div><a href="#progress" class="text-link" style="display:block;margin-top:15px">Мой прогресс →</a></section><section class="panel word-panel"><div class="eyebrow">Palabra del día · слово дня</div><div class="row spread"><div class="word-big">sobremesa</div>${audioBtn('sobremesa')}</div><p class="tiny muted">[собреме́са] · сущ., ж. р.</p><p style="margin-top:9px">Разговоры за столом после еды</p><blockquote>«La sobremesa se alargó hasta las cinco.»</blockquote><p class="tiny muted">Беседа после еды затянулась до пяти.</p><div class="note" style="margin-bottom:0">Иногда самое интересное начинается, когда тарелки уже пусты.</div></section></aside></div>`+foot()}
function course(){app.innerHTML=intro('Tu camino','Твой маршрут в испанский','12 тем, которые превращают отдельные слова в разговор.')+`<div class="filters">${['all','A1','A2'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${f==='all'?'Все темы':f==='A1'?'A1 · Начинаю':'A2 · Продолжаю'}</button>`).join('')}</div><div class="course-grid">${topics.filter(t=>filter==='all'||t.level===filter).map(t=>`<article class="course-card"><div class="course-art"><span>${t.icon}</span><span class="pill">${t.level} · ${state.completed.includes(t.id)?'✓ Пройдено':'5–8 мин'}</span></div><div class="course-body"><div class="eyebrow">Тема ${String(topics.indexOf(t)+1).padStart(2,'0')}</div><h3 style="margin-top:7px">${t.name}</h3><p>${t.desc}</p><button class="btn ${state.completed.includes(t.id)?'secondary':'green'}" data-lesson="${t.id}">${state.completed.includes(t.id)?'Повторить тему':'Открыть урок'} →</button></div></article>`).join('')}</div>`+foot()}
function startLesson(id){session={topic:topics.find(t=>t.id===id),index:0,score:0,answered:false,mode:'lesson'};let t=session.topic;app.innerHTML=`<div class="exercise"><button class="text-link" data-action="back">← К занятиям</button><div class="eyebrow" style="margin-top:25px">${t.level} · Тема ${topics.indexOf(t)+1} / 12</div><h1>${t.icon} ${t.name}</h1><p class="muted">Сначала разберёмся. Затем попробуем.</p><section class="panel lesson-theory" style="margin-top:25px"><p>${t.rule}</p><ul>${t.examples.map(e=>`<li>${e} ${audioBtn(e.split(' — ')[0])}</li>`).join('')}</ul><div class="note">💡 ${t.tip}</div><button class="btn" data-action="quiz-start">Попробовать на практике →</button></section></div>`;window.scrollTo(0,0)}
function showQuestion(){let s=session,t=s.topic,q=s.mode==='lesson'?t.q[s.index]:s.questions[s.index];s.answered=false;let total=s.mode==='lesson'?t.q.length:s.questions.length;app.innerHTML=`<div class="exercise"><div class="exercise-head"><button class="text-link" data-action="back">✕ Выйти</button><div class="progress"><span style="width:${s.index/total*100}%"></span></div><span class="tiny">${s.index+1} / ${total}</span></div><div class="eyebrow">${s.mode==='listen'?'Аудирование · слушай и выбирай':s.mode==='build'?'Собери фразу':'Проверь себя'}</div>${s.mode==='listen'?`<div class="panel center" style="margin:25px 0"><button class="btn green" data-speak="${esc(q[4])}">▷ Прослушать фразу</button> <button class="btn secondary" data-slow="${esc(q[4])}">Медленнее</button><p class="tiny muted" style="margin-top:14px">Озвучка использует испанский голос браузера.</p></div>`:''}<h2 class="prompt">${q[0]}</h2><div class="options">${q[1].map((o,i)=>`<button class="option" data-answer="${i}"><span class="muted" style="margin-right:15px">${i+1}</span>${esc(o)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>`}
function answer(i){if(!session||session.answered)return;session.answered=true;let s=session,q=s.mode==='lesson'?s.topic.q[s.index]:s.questions[s.index],ok=i===q[2];if(ok){s.score++;reward(10)}document.querySelectorAll('[data-answer]').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');else if(n===i)b.classList.add('wrong')});document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'¡Muy bien! Всё верно.':'Почти! Давай разберёмся.'}</strong><p>${q[3]}</p><button class="btn ${ok?'green':''}" data-action="next">Дальше →</button></div>`}
function nextQuestion(){session.index++;let total=session.mode==='lesson'?session.topic.q.length:session.questions.length;if(session.index<total){showQuestion();return}let s=session,passed=s.score/total>=2/3;if(s.mode==='lesson'&&passed&&!state.completed.includes(s.topic.id)){state.completed.push(s.topic.id);reward(20)}app.innerHTML=`<div class="exercise panel center"><div style="font-size:62px">${passed?'✦':'🌱'}</div><div class="eyebrow">${passed?'¡Buen trabajo!':'Poco a poco'}</div><h1>${passed?'Ещё один шаг вперёд.':'Ошибки — часть пути.'}</h1><p class="muted">${s.score} из ${total} верно · ${s.score*10} XP за ответы</p><div class="note">${s.mode==='lesson'?(passed?'Тема отмечена как пройденная. При первом прохождении начисляется ещё 20 XP.':'Чтобы завершить тему, ответь верно хотя бы на 2 вопроса из 3. Прочитай объяснения и попробуй снова.'):'Практика завершена. Возвращайся, чтобы закрепить результат.'}</div><div class="row" style="justify-content:center"><button class="btn secondary" data-action="back">К занятиям</button><button class="btn" data-action="retry">Повторить</button></div></div>`;save()}
function vocabulary(){app.innerHTML=intro('Palabras que se quedan','Твой запас слов','72 слова и выражения. Слушай, сохраняй и возвращайся к ним.')+`<div class="panel row spread"><div><h3>Вспомни, прежде чем подсмотреть</h3><p class="muted tiny">Карточки возвращаются через 1, 3, 7, 14 и 30 дней.</p></div><button class="btn green" data-action="review">Повторить слова →</button></div><div class="filters"><button class="chip ${!onlySaved?'active':''}" data-words-filter="all">Все слова</button><button class="chip ${onlySaved?'active':''}" data-words-filter="saved">★ Избранное (${state.favorites.length})</button><select class="chip" id="word-topic" aria-label="Тема слов"> <option value="all">Все темы</option>${topics.map(t=>`<option value="${t.id}" ${filter===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div><input class="search" id="word-search" placeholder="Найти слово по-русски или по-испански…" aria-label="Поиск слов" value="${esc(wordQuery)}"><div id="word-list" style="margin-top:22px"></div>`+foot();wordList()}
function wordList(){let list=words.filter(w=>(filter==='all'||w.topic===filter)&&(!onlySaved||state.favorites.includes(w.id))&&(w.es+' '+w.ru).toLowerCase().includes(wordQuery.toLowerCase()));document.querySelector('#word-list').innerHTML=list.length?`<div class="vocab-grid">${list.map(w=>`<article class="vocab-card"><div><strong>${w.es}</strong><p>${w.ru}</p><span class="tiny muted">${topics.find(t=>t.id===w.topic).level}</span></div><div class="vocab-actions">${audioBtn(w.es)}<button class="star" data-star="${w.id}" aria-label="${state.favorites.includes(w.id)?'Убрать из избранного':'В избранное'}: ${w.es}" aria-pressed="${state.favorites.includes(w.id)}">${state.favorites.includes(w.id)?'★':'☆'}</button></div></article>`).join('')}</div>`:`<div class="empty muted">${onlySaved?'Добавь слова в избранное с помощью ☆.':'По этому запросу ничего нет. Попробуй другое слово.'}</div>`}
function startReview(){let pool=words.filter(w=>!state.reviews[w.id]||state.reviews[w.id].due<=Date.now());review={list:shuffle(pool).slice(0,10),index:0,flipped:false};showReview()}
function showReview(){let r=review;if(r.index>=r.list.length){app.innerHTML=`<div class="exercise panel center"><div style="font-size:50px">🌿</div><h1>${r.list.length?'Слова стали ближе.':'Всё повторено!'}</h1><p class="muted">${r.list.length?'Ты повторил(а) '+r.list.length+' слов. Следующие даты сохранены.':'На сегодня нет карточек к повторению. Новая порция появится позже.'}</p><button class="btn" style="margin-top:25px" data-action="back">Вернуться</button></div>`;return}let w=r.list[r.index];app.innerHTML=`<div class="exercise"><div class="row spread"><button class="text-link" data-action="back">← Назад</button><span class="tiny">${r.index+1} / ${r.list.length}</span></div><h1>Узнаёшь это слово?</h1><p class="muted" style="margin-bottom:25px">Сначала вспомни перевод, затем переверни карточку.</p><button class="flashcard" data-action="flip"><span class="eyebrow">${r.flipped?'Перевод':'Español'}</span><strong>${r.flipped?w.ru:w.es}</strong><span class="tiny muted">Нажми, чтобы ${r.flipped?'увидеть слово':'проверить себя'} ↻</span></button><div class="center" style="margin:20px">${audioBtn(w.es)}</div>${r.flipped?'<div class="row" style="justify-content:center"><button class="btn secondary" data-review="again">Пока не помню</button><button class="btn green" data-review="know">Вспомнил(а) ✓</button></div>':''}</div>`}
function rateReview(know){if(!review||!review.flipped)return;let w=review.list[review.index],old=state.reviews[w.id]||{level:0},level=know?Math.min(5,old.level+1):0;state.reviews[w.id]={level,due:Date.now()+(know?[1,3,7,14,30][level-1]*86400000:600000)};reward(know?5:1);review.index++;review.flipped=false;showReview()}
const grammarData=[{title:'Ser или estar?',desc:'Кто ты, где ты и как себя чувствуешь.',body:'<p><b>Ser</b>: личность, происхождение, профессия. <b>Estar</b>: местонахождение людей и предметов, состояние.</p><table><tr><th>Ser</th><th>Estar</th></tr><tr><td>Soy estudiante.<br>Я студент(ка).</td><td>Estoy en casa.<br>Я дома.</td></tr><tr><td>Es de España.<br>Он / она из Испании.</td><td>Está cansado.<br>Он устал.</td></tr></table><p>Правило «постоянное / временное» не универсально. Учи глагол вместе с ситуацией.</p>',topic:'people'},{title:'Настоящее время',desc:'Глаголы на -ar, -er и -ir без путаницы.',body:'<table><tr><th>Лицо</th><th>Hablar</th><th>Comer</th><th>Vivir</th></tr>'+[['yo','hablo','como','vivo'],['tú','hablas','comes','vives'],['él/ella','habla','come','vive'],['nosotros','hablamos','comemos','vivimos'],['vosotros','habláis','coméis','vivís'],['ellos','hablan','comen','viven']].map(a=>'<tr>'+a.map(s=>'<td>'+s+'</td>').join('')+'</tr>').join('')+'</table><p>Это правильные глаголы. Ser, tener, ir и другие частые глаголы имеют особые формы.</p>',topic:'day'},{title:'Gustar: нравится',desc:'Почему me gusta, но me gustan?',body:'<p><b>Me gusta el café.</b> — Мне нравится кофе.<br><b>Me gustan los libros.</b> — Мне нравятся книги.<br><b>Me gusta viajar.</b> — Мне нравится путешествовать.</p><div class="note">Me / te / le / nos / os / les показывают, кому нравится. Число глагола зависит от того, что нравится.</div><p>Для уточнения: <b>A María le gusta el té.</b> — Марии нравится чай.</p>',topic:'food'},{title:'Артикли и род',desc:'El, la, un, una: маленькие важные слова.',body:'<table><tr><th></th><th>Мужской</th><th>Женский</th></tr><tr><td>Определённый</td><td>el / los</td><td>la / las</td></tr><tr><td>Неопределённый</td><td>un / unos</td><td>una / unas</td></tr></table><p>El libro — книга, la casa — дом. Окончания -o/-a часто помогают, но есть исключения: <b>el día</b>, <b>la mano</b>.</p><div class="note">Agua — женского рода, но в единственном числе: el agua из-за ударного начального a. Прилагательное остаётся женским: el agua fría.</div>',topic:'cafe'},{title:'Планы: ir a + infinitivo',desc:'Расскажи, что собираешься сделать.',body:'<p>Форма <b>ir</b> + <b>a</b> + глагол в начальной форме:</p><ul><li>Voy a estudiar. — Я собираюсь учиться.</li><li>¿Vas a venir? — Ты собираешься прийти?</li><li>Vamos a viajar. — Мы собираемся путешествовать.</li></ul><div class="note">Ir: voy, vas, va, vamos, vais, van. Не забывай a перед инфинитивом.</div>',topic:'travel'},{title:'Прошедшее: indefinido',desc:'Завершённые события: ayer, el sábado…',body:'<table><tr><th>Лицо</th><th>Hablar</th><th>Comer / vivir</th></tr><tr><td>yo</td><td>hablé</td><td>comí / viví</td></tr><tr><td>tú</td><td>hablaste</td><td>comiste / viviste</td></tr><tr><td>él/ella</td><td>habló</td><td>comió / vivió</td></tr><tr><td>nosotros</td><td>hablamos</td><td>comimos / vivimos</td></tr><tr><td>vosotros</td><td>hablasteis</td><td>comisteis / vivisteis</td></tr><tr><td>ellos</td><td>hablaron</td><td>comieron / vivieron</td></tr></table><p>Ser и ir имеют одинаковые формы в этом времени: fui, fuiste, fue, fuimos, fuisteis, fueron. Значение понятно из контекста.</p>',topic:'past'}];
function grammar(){app.innerHTML=intro('Menos reglas, más sentido','Грамматика без тумана','Короткое объяснение. Понятный пример. Сразу в практику.')+`<div class="split">${grammarData.map((g,i)=>`<article class="grammar-card"><div class="eyebrow">${i<4?'Основы · A1':'Следующий шаг · A2'}</div><h2 style="margin-top:10px">${g.title}</h2><p>${g.desc}</p><button class="btn secondary small" data-grammar="${i}">Разобраться →</button></article>`).join('')}</div>`+foot()}

const scenarios=[{title:'В маленьком кафе',icon:'☕',place:'Madrid · Кафе на углу',desc:'Закажи напиток и попроси счёт.',steps:[['¡Hola! ¿Qué te pongo?','Привет! Что тебе принести?',['Un café con leche, por favor.','Soy de Estonia.','Tengo veinte años.'],0,'Заказ должен отвечать на вопрос официанта: un café con leche.'],['¿Quieres algo para comer?','Хочешь что-нибудь поесть?',['La estación está aquí.','Sí, una tostada, por favor.','Me llamo Ana.'],1,'Официант предлагает еду. Una tostada — тост.'],['Muy bien. ¿Algo más?','Хорошо. Что-нибудь ещё?',['No, gracias. La cuenta, por favor.','Buenos días.','Tengo una hermana.'],0,'После заказа можно отказаться от добавок и попросить счёт.']]},{title:'Билет на юг',icon:'🚆',place:'Sevilla · Железнодорожный вокзал',desc:'Купи билет и уточни время.',steps:[['Buenos días. ¿Adónde quiere viajar?','Доброе утро. Куда вы хотите поехать?',['A Sevilla, por favor.','Soy profesor.','Un café solo.'],0,'В ответе нужно направление: a Sevilla.'],['¿Ida o ida y vuelta?','В одну сторону или туда и обратно?',['A las ocho.','Ida y vuelta, por favor.','Me gusta la paella.'],1,'Ida y vuelta — туда и обратно.'],['El próximo tren sale a las diez.','Следующий поезд отправляется в десять.',['Perfecto. ¿De qué andén sale?','Tengo frío.','Soy de Madrid.'],0,'Andén — платформа. Это подходящий вопрос после покупки билета.']]},{title:'Новый знакомый',icon:'👋',place:'Barcelona · Языковая встреча',desc:'Представься и найди общую тему.',steps:[['¡Hola! Soy Pablo. ¿Cómo te llamas?','Привет! Я Пабло. Как тебя зовут?',['Me llamo Alex. Mucho gusto.','Un té, por favor.','Hasta mañana.'],0,'Me llamo… — естественный ответ на вопрос об имени.'],['¿De dónde eres?','Откуда ты?',['Tengo una reserva.','Soy de Estonia. ¿Y tú?','Estoy cansado.'],1,'Происхождение выражают с ser de.'],['Soy de España. ¿Te gusta viajar?','Я из Испании. Тебе нравится путешествовать?',['Sí, me gusta mucho.','Son las dos.','La cuenta, por favor.'],0,'После вопроса о предпочтении подойдёт me gusta mucho.']]},{title:'Заселение в отель',icon:'🛎️',place:'Valencia · Небольшой отель',desc:'Подтверди бронь и уточни детали.',steps:[['Buenas tardes. ¿Tiene una reserva?','Добрый день. У вас есть бронь?',['Sí, tengo una reserva a nombre de Alex.','No como carne.','Vamos al cine.'],0,'A nombre de… — на имя…'],['¿Para cuántas noches?','На сколько ночей?',['A la derecha.','Para dos noches.','Tengo dos hermanos.'],1,'Para dos noches — на две ночи.'],['Aquí tiene su llave.','Вот ваш ключ.',['Gracias. ¿A qué hora es el desayuno?','Soy estudiante.','Ayer fui al cine.'],0,'Можно уточнить время завтрака: ¿a qué hora es el desayuno?']]}];
function dialogues(){app.innerHTML=intro('Conversaciones de verdad','Испанский случается в жизни','Выбирай реплики, слушай собеседника и пробуй снова.')+`<div class="split">${scenarios.map((s,i)=>`<article class="course-card"><div class="course-art"><span>${s.icon}</span><span class="pill">3 реплики · 3–5 мин</span></div><div class="course-body"><div class="eyebrow">${s.place}</div><h2 style="margin-top:10px">${s.title}</h2><p>${s.desc}</p><button class="btn green" data-dialog="${i}">Начать разговор →</button></div></article>`).join('')}</div><div class="note">Это учебные диалоги с готовыми вариантами ответов. Реплики можно прослушать и произнести вслед за собеседником.</div>`+foot()}
function startDialog(i){dialog={id:i,index:0,history:[],done:false,attempted:false};showDialog()}
function showDialog(){let d=dialog,s=scenarios[d.id],st=s.steps[d.index];app.innerHTML=`<div class="dialogue"><button class="text-link" data-action="back">← Все диалоги</button><div class="eyebrow" style="margin-top:25px">${s.place}</div><h1>${s.icon} ${s.title}</h1>${d.history.map(h=>`<div class="bubble"><small>Собеседник</small><p>${h[0]} ${audioBtn(h[0])}</p></div><div class="bubble mine"><small>Ты</small><p>${h[1]} ${audioBtn(h[1])}</p></div>`).join('')}${d.done?`<div class="panel center"><h2>¡Hasta la próxima!</h2><p class="muted" style="margin:15px">Разговор состоялся. Попробуй произнести свои реплики вслух.</p><button class="btn" data-action="back">Другие ситуации →</button></div>`:`<div class="bubble"><small>Собеседник · ${d.index+1} / 3</small><p>${st[0]} ${audioBtn(st[0])}</p><details><summary class="tiny muted">Показать перевод</summary><p class="translation">${st[1]}</p></details></div><p class="eyebrow" style="margin:25px 0 12px">Что ответишь?</p><div class="options">${st[2].map((o,i)=>`<button class="option" data-reply="${i}">${o}</button>`).join('')}</div><div id="dialog-feedback" aria-live="polite"></div>`}</div>`}
function reply(i){let d=dialog,st=scenarios[d.id].steps[d.index];if(i!==st[3]){d.attempted=true;document.querySelector('#dialog-feedback').innerHTML=`<div class="feedback bad"><strong>Эта реплика не подходит к ситуации.</strong><p>${st[4]} Попробуй ещё раз.</p></div>`;return}reward(d.attempted?3:10);d.history.push([st[0],st[2][i]]);d.index++;d.attempted=false;d.done=d.index>=3;showDialog()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function games(){app.innerHTML=intro('Práctica a tu manera','Меняй формат. Сохраняй интерес.','Небольшие тренировки для слов, слуха и испанских фраз.')+`<div class="split">${[['match','↔','Найди пару','Соедини 6 испанских слов с переводами.'],['listen','◖))','Поймай на слух','Послушай фразу и выбери её смысл.'],['build','▤','Порядок имеет значение','Найди правильную конструкцию фразы.'],['review','▱','Карточки памяти','Вспомни перевод до того, как перевернёшь.']].map(([a,ic,t,d])=>`<article class="grammar-card"><div class="card-icon">${ic}</div><h2>${t}</h2><p>${d}</p><button class="btn green" data-action="${a}">Начать →</button></article>`).join('')}</div>`+foot()}
function startListen(){session={mode:'listen',index:0,score:0,answered:false,questions:shuffle(topics).slice(0,5).map(t=>{let opts=shuffle([t,...shuffle(topics.filter(x=>x.id!==t.id)).slice(0,2)]);return ['Что означает услышанная фраза?',opts.map(x=>x.translation),opts.indexOf(t),`${t.sentence} — ${t.translation}`,t.sentence]})};showQuestion()}
function startBuild(){session={mode:'build',index:0,score:0,answered:false,questions:[['Выбери: «Я собираюсь поехать в Мадрид».',['Voy viajar a Madrid','Voy a viajar a Madrid','Soy a viajar Madrid'],1,'В конструкции планов нужны ir + a + инфинитив: voy a viajar.'],['Выбери: «Мне нравятся апельсины».',['Me gustan las naranjas','Me gusta las naranjas','Yo gustan naranjas'],0,'Las naranjas — множественное число. Поэтому me gustan.'],['Выбери: «Где находится вокзал?»',['¿Dónde es la estación?','¿Dónde la estación está?','¿Dónde está la estación?'],2,'Нейтральный порядок вопроса: вопросительное слово + глагол + подлежащее.'],['Выбери: «Мы собираемся пойти в кино».',['Vamos al ir cine','Vamos a ir al cine','Somos a ir al cine'],1,'Vamos a ir — собираемся пойти; a + el cine = al cine.']]};showQuestion()}
function startMatch(){let list=shuffle(words).slice(0,6);match={list,right:shuffle(list),selected:null,matched:[],mistakes:0};showMatch()}
function showMatch(){let m=match;app.innerHTML=`<div class="exercise"><button class="text-link" data-action="back">← Практика</button><h1>Найди друг друга.</h1><p class="muted">Нажми слово слева, затем его перевод справа.</p><div class="row spread" style="margin:25px 0"><span class="pill">${m.matched.length} / 6 пар</span><span class="tiny muted">Ошибок: ${m.mistakes}</span></div><div class="match-grid">${m.list.map((w,i)=>`<button class="match ${m.matched.includes(w.id)?'matched':''} ${m.selected===w.id?'selected':''}" data-match-left="${w.id}" ${m.matched.includes(w.id)?'disabled':''}>${w.es}</button><button class="match ${m.matched.includes(m.right[i].id)?'matched':''}" data-match-right="${m.right[i].id}" ${m.matched.includes(m.right[i].id)?'disabled':''}>${m.right[i].ru}</button>`).join('')}</div>${m.matched.length===6?'<div class="feedback center"><h2>¡Perfecto! Все пары на месте.</h2><p>За каждую пару ты получил(а) 5 XP.</p><button class="btn" data-action="match">Ещё раунд →</button></div>':''}</div>`}
function progressPage(){let learned=Object.values(state.reviews).filter(r=>r.level>0).length;app.innerHTML=intro('Mira cuánto has avanzado','Каждый шаг считается.','Здесь твои настоящие результаты — без выдуманных достижений.')+`<div class="stat-grid">${[[state.xp,'опыт · XP'],[state.completed.length+'/12','тем пройдено'],[learned,'слов на повторении'],[streak(),'дней подряд']].map(([n,t])=>`<div class="panel stat"><strong>${n}</strong><span>${t}</span></div>`).join('')}</div><div class="split"><section class="panel"><h2>Твоя регулярность</h2><p class="muted tiny" style="margin:8px 0 20px">Опыт за последние 14 дней</p><div style="display:flex;gap:7px;height:160px;align-items:flex-end">${Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-13+i);let xp=state.activity[d.toLocaleDateString('en-CA')]||0,max=Math.max(50,...Object.values(state.activity));return `<div style="flex:1;text-align:center" title="${d.toLocaleDateString('ru')}: ${xp} XP"><div style="height:${Math.max(4,xp/max*125)}px;background:${xp?'var(--green)':'#e5e8db'};border-radius:5px 5px 0 0"></div><span style="font-size:9px;color:var(--muted)">${d.getDate()}</span></div>`}).join('')}</div><div class="note"><label for="goal">Цель на день</label> <select id="goal" class="chip">${[20,30,50,100].map(n=>`<option value="${n}" ${state.goal===n?'selected':''}>${n} XP</option>`).join('')}</select></div><p class="tiny muted">XP отражает практику, а не подтверждённый уровень владения языком.</p></section><section class="panel"><h2>Маленькие победы</h2>${[['🌱','Первый шаг','Заверши одну тему',state.completed.length>=1],['☀','В ритме','Занимайся 3 дня подряд',streak()>=3],['📚','Коллекционер слов','Повтори 20 слов по памяти',learned>=20],['🧭','Весь маршрут','Заверши все 12 тем',state.completed.length===12]].map(([ic,t,d,ok])=>`<div class="achievement ${ok?'':'off'}"><span class="medal">${ic}</span><div><strong>${t} ${ok?'✓':''}</strong><p>${d}</p></div></div>`).join('')}</section></div><section class="panel" style="margin-top:24px"><h3>Прогресс хранится на этом устройстве</h3><p class="muted tiny" style="margin:8px 0 17px">Экспортируй резервную копию, чтобы перенести её в другой браузер. Регистрация не требуется.</p><div class="row"><button class="btn secondary small" data-action="export">↓ Скачать прогресс</button><label class="btn secondary small" for="import-file">↑ Загрузить прогресс</label><input type="file" id="import-file" accept="application/json,.json" class="hidden"></div></section>`+foot()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.speak!==undefined){speak(d.speak);return}if(d.slow!==undefined){speak(d.slow,true);return}if(d.lesson){startLesson(d.lesson);return}if(d.answer!==undefined){answer(+d.answer);return}if(d.filter){filter=d.filter;course();return}if(d.wordsFilter){onlySaved=d.wordsFilter==='saved';vocabulary();return}if(d.star){state.favorites=state.favorites.includes(d.star)?state.favorites.filter(x=>x!==d.star):[...state.favorites,d.star];save();wordList();return}if(d.grammar!==undefined){openGrammar(+d.grammar);return}if(d.dialog!==undefined){startDialog(+d.dialog);return}if(d.reply!==undefined){reply(+d.reply);return}if(d.review){rateReview(d.review==='know');return}if(d.matchLeft){match.selected=d.matchLeft;showMatch();return}if(d.matchRight){if(!match.selected){toast('Сначала выбери испанское слово слева.');return}if(match.selected===d.matchRight){match.matched.push(d.matchRight);reward(5);match.selected=null;showMatch()}else{match.mistakes++;toast('Пока не совпало. Попробуй другой перевод.');showMatch()}return}switch(d.action){case'back':session=null;review=null;dialog=null;match=null;render();break;case'quiz-start':showQuestion();break;case'next':nextQuestion();break;case'retry':if(session.mode==='lesson')startLesson(session.topic.id);else if(session.mode==='listen')startListen();else startBuild();break;case'review':startReview();break;case'flip':review.flipped=!review.flipped;showReview();break;case'listen':startListen();break;case'build':startBuild();break;case'match':startMatch();break;case'export':{let blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hablar-ya-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}}});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){wordQuery=e.target.value;wordList()}});document.addEventListener('change',async e=>{if(e.target.id==='word-topic'){filter=e.target.value;wordList()}if(e.target.id==='goal'){state.goal=+e.target.value;save();toast('Цель обновлена.')}if(e.target.id==='import-file'){let file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error();let data=JSON.parse(await file.text());if(data.version!==1||!Number.isFinite(data.xp)||data.xp<0||!Array.isArray(data.completed)||!Array.isArray(data.favorites)||!data.activity||!data.reviews||![20,30,50,100].includes(data.goal))throw Error();if(!data.completed.every(id=>topics.some(t=>t.id===id))||!data.favorites.every(id=>words.some(w=>w.id===id)))throw Error();if(!Object.entries(data.activity).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isFinite(v)&&v>=0))throw Error();if(!Object.entries(data.reviews).every(([k,v])=>words.some(w=>w.id===k)&&v&&Number.isInteger(v.level)&&v.level>=0&&v.level<=5&&Number.isFinite(v.due)))throw Error();if(!confirm('Заменить текущий прогресс данными из файла?'))return;state={xp:data.xp,completed:[...new Set(data.completed)],favorites:[...new Set(data.favorites)],activity:data.activity,reviews:data.reviews,goal:data.goal};save();progressPage();toast('Прогресс восстановлен.')}catch{toast('Файл не подходит. Выбери резервную копию Hablar ya.')}}});window.addEventListener('hashchange',route);route();
</script></body></html>
